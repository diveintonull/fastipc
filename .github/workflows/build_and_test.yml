name: FastIPC CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            cxx_flags: ""
            linker_flags: ""
          - name: Release
            build_type: Release
            cxx_flags: ""
            linker_flags: ""
          - name: ASan
            build_type: Debug
            cxx_flags: "-fsanitize=address -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=address"
          - name: UBSan
            build_type: Debug
            cxx_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=undefined"
          - name: TSan
            build_type: Debug
            cxx_flags: "-fsanitize=thread -fno-omit-frame-pointer"
            linker_flags: "-fsanitize=thread"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DFASTIPC_BUILD_TESTS=ON \
            -DFASTIPC_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure
